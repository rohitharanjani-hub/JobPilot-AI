```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | JobPilot AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="text-center">
                <h1 class="brand-name">
                    JobPilot <span>AI</span>
                </h1>

                <p class="text-muted">
                    Start building your career with AI
                </p>
            </div>

            <div class="mt-4">
                <h3>Create your account</h3>

                <p class="text-muted">
                    Join JobPilot AI and manage your job search smarter.
                </p>
            </div>

            <div id="message" class="mt-3" role="alert"
                 aria-live="polite"></div>

            <form id="registerForm">

                <div class="mb-3">
                    <label for="name" class="form-label">
                        Full name
                    </label>

                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email address
                    </label>

                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            class="btn btn-light"
                            type="button"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <small class="text-muted">
                        Use at least 8 characters.
                    </small>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100 mt-3"
                    id="registerButton"
                >
                    <i class="bi bi-person-plus me-2"></i>
                    Create Account
                </button>

            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">
                    Already have an account?
                    <a href="login.html">Sign in</a>
                </p>
            </div>

            <div class="text-center mt-4">
                <small class="text-muted">
                    © 2026 JobPilot AI. All rights reserved.
                </small>
            </div>

        </section>

    </main>

    <script src="../js/main.js"></script>

</body>
</html>
```
